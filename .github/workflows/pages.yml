name: Deploy to GitHub Pages

# The site is the live app from main at the root, a preview of every open pull request under pr/<number>/,
# and a listing of them all at builds/: what each change is for, a link to view it, a link to the pull request.
# Every run rebuilds the whole site from main and the pull requests open at that moment, so a preview appears
# when a pull request opens, follows every push to it, and leaves when it closes.
#
# Security: pull_request_target runs this file and scripts/build-pages.mjs as they are on main, never as a pull
# request has them, and only main may deploy to the github-pages environment. A pull request's files are copied
# into the site with `git archive`; nothing from a pull request is installed, built or run here. Previews are
# made for branches of this repository only. A fork is listed without one, because a preview is served from
# the same origin as the live app.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, closed, edited, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# One deployment at a time. A run that is waiting is replaced by a newer one; each run builds everything,
# so the newest is always complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}builds/
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build the site from main and the open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 50 \
            --json number,title,body,author,headRefName,headRefOid,baseRefName,isDraft,isCrossRepository,url,updatedAt,additions,deletions,changedFiles,reviewDecision,labels \
            > "$RUNNER_TEMP/prs.json"
          node scripts/build-pages.mjs --out "$RUNNER_TEMP/site" --prs "$RUNNER_TEMP/prs.json" \
            --repo "$GITHUB_REPOSITORY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          du -sh "$RUNNER_TEMP/site" "$RUNNER_TEMP/site"/pr/* 2>/dev/null || true
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v5
